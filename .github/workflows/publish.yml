name: CI & Publish

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  branch-name:
    name: Branch naming
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require feature/, fix/ or chore/ prefix
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(feature|fix|chore)/[a-z0-9._-]+$ ]]; then
            echo "::error::Branch '$HEAD_REF' must match feature/<name>, fix/<name> or chore/<name> (lowercase, kebab-case). See CONTRIBUTING.md."
            exit 1
          fi

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - run: npm run build

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${TAG#v}" != "$VERSION" ]]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$VERSION'."
            exit 1
          fi
      - run: npm run build
      # Authenticates via npm trusted publishing; no NPM_TOKEN secret needed.
      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
